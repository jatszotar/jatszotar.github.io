  <rect class="bg" x="4" y="4" width="56" height="56" rx="14" />
  <rect class="tile-dim" x="12" y="12" width="12" height="12" rx="3" />
  <rect class="tile-dim" x="26" y="12" width="12" height="12" rx="3" />
  <rect class="tile-bright" x="40" y="12" width="12" height="12" rx="3" />
  <rect class="tile-dim" x="12" y="26" width="12" height="12" rx="3" />
  <rect class="tile-dim" x="26" y="26" width="12" height="12" rx="3" />
  <rect class="tile-bright" x="40" y="26" width="12" height="12" rx="3" />
  <rect class="tile-bright" x="12" y="40" width="12" height="12" rx="3" />
  <rect class="tile-bright" x="26" y="40" width="12" height="12" rx="3" />
  <rect class="tile-dim" x="40" y="40" width="12" height="12" rx="3" />
</svg>
